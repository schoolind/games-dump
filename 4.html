<!DOCTYPE html>
<html lang="en">
<head>
<link rel="icon" type="image/x-icon" href="https://920.ncsis.gov/campus/nav-wrapper/assets/icons/favicon-32x32.png">
</head>
<body>
<script>
fetch("https://cdn.jsdelivr.net/gh/schoolind/games-dump@main/1.html")
  .then(res => res.text())
  .then(html => {
    var parser = new DOMParser();
    var doc = parser.parseFromString(html, 'text/html');
    document.head.innerHTML = doc.head.innerHTML;
    document.body.innerHTML = doc.body.innerHTML;
  });
</script>
</body>
</html>
